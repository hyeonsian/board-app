spring.application.name=board

# ---- 빌드 정보: Maven 이 빌드할 때 아래 골뱅이(at 기호)로 감싼 이름에 값을 채워 넣습니다 (리소스 필터링) ----
app.version=@project.version@
app.build=@build.number@
app.commit=@git.commit@

# ---- DB 접속 기본값(개발용) ----
# 서버(운영)에서는 /etc/boardapp/application.properties 가 이 값을 덮어씁니다.
# 비밀번호 같은 비밀값은 이 파일(= Git 에 올라가는 파일)에 절대 넣지 않습니다.
spring.datasource.url=jdbc:mariadb://localhost:3306/boarddb
spring.datasource.username=board
spring.datasource.password=CHANGE_ME
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ---- 커넥션 풀(HikariCP) ----
# 동시에 DB 로 열 수 있는 연결 수. 너무 작으면 요청이 줄 서고, 너무 크면 DB 가 힘들어집니다.
spring.datasource.hikari.maximum-pool-size=10
# 풀에서 연결을 못 얻을 때 기다리는 시간(ms). DB 장애 시 요청이 무한정 매달리지 않게 짧게.
spring.datasource.hikari.connection-timeout=3000

# ---- 운영 점검용 스위치 ----
# true 로 빌드/배포하면 앱이 일부러 기동 실패 (롤백 실습용)
app.fail-on-start=false
# 이 파일이 있으면 /ready 가 503 (로드밸런서에서 이 서버를 빼는 용도)
app.maintenance-file=/etc/boardapp/maintenance

logging.level.com.example=INFO
